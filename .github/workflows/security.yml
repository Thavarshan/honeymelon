name: Static security analysis
on:
  workflow_call:
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript,actions
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: sarif-results
      - name: Reject high severity static findings
        run: node scripts/check-sarif.mjs sarif-results
      - name: Preserve static analysis findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-sarif
          path: sarif-results
          retention-days: 7
