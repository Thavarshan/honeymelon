name: Temporary formatting inspection for issue 117

on:
  push:
    branches: ['docs/issue-117-ethical-outreach-plan']
    paths: ['.github/workflows/format-inspect-117.yml']

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Show formatter diff
        run: |
          npm exec --yes --package prettier@3.9.10 -- prettier --write docs/marketing/outreach/*.md
          git diff -- docs/marketing/outreach
